<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://hook.us2.make.com https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; frame-src https://*.line.me; media-src https: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<title>會員專區</title>
<style>
:root{
  --bg:#F5F6FA;--card:#FFFFFF;--text:#1F2330;--soft:#5D6475;--muted:#8A90A0;--line:#E2E5EE;
  --brand:#3B5BDB;--on-brand:#FFFFFF;--brand-bg:#E8EDFD;--accent:#F59F00;--accent-bg:#FFF4DB;
  --green:#2B7A3D;--green-bg:#E3F1E6;--amber:#8A5300;--amber-bg:#FFF1D6;--red:#B42318;--red-bg:#FDE7E5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13151C;--card:#1D2029;--text:#E9EBF2;--soft:#AEB4C4;--muted:#7F8698;--line:#323746;
  --brand:#8DA2FB;--on-brand:#13151C;--brand-bg:#232B4A;--accent:#FFC24D;--accent-bg:#3A2E12;
  --green:#6BC283;--green-bg:#1E3325;--amber:#F2B451;--amber-bg:#3A2C12;--red:#F2867B;--red-bg:#3D1E1B;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{padding:18px 0 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;margin-left:-6px;border-radius:10px;display:grid;place-items:center;font-size:30px;line-height:1;color:var(--brand);flex:none}
.back:active{background:var(--brand-bg)}
.mark[hidden]{display:none}
.mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand{font-weight:800;font-size:18px}
.badge{margin-left:auto;font-size:13px;font-weight:700;border-radius:10px;padding:3px 10px;white-space:nowrap}
.badge.guest{background:var(--brand-bg);color:var(--brand)}
.badge.pending{background:var(--amber-bg);color:var(--amber)}
.badge.member{background:var(--green-bg);color:var(--green)}
.badge.premium{background:var(--accent-bg);color:var(--accent)}
.badge.expired{background:var(--red-bg);color:var(--red)}
.badge.banned{background:var(--red-bg);color:var(--red)}
h1{font-size:21px;margin:20px 0 6px}
.lead{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.card h2{font-size:17px;margin-bottom:6px}
.status{text-align:center;padding:28px 12px}
.status .big{font-size:44px;line-height:1}
.status h2{font-size:19px;margin:10px 0 6px}
label.f{display:block;margin-top:14px;font-size:14px;color:var(--soft)}
label.f b{color:var(--red);font-weight:400}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
label.f textarea{min-height:80px;resize:vertical}
.plans{display:grid;gap:10px;margin-top:10px}
.plan{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.plan input{margin-top:5px;accent-color:var(--brand)}
.plan b{display:block}
.plan small{color:var(--soft)}
.plan.on{border-color:var(--brand);background:var(--brand-bg)}
.bank{margin-top:12px;border-radius:12px;background:var(--brand-bg);padding:12px 14px;font-size:15px}
.demo{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:1px 8px;vertical-align:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:528px;margin:0 auto}
.primary{width:100%;height:52px;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:17px}
.primary:disabled{opacity:.45}
.links{display:grid;gap:10px;margin-top:16px}
.link{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
.link .ic{font-size:26px}
.link b{display:block}
.link small{color:var(--soft)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
dt{color:var(--soft)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;max-width:90%}
.blocked{text-align:center;color:var(--soft);padding:48px 12px}
.blocked h2{color:var(--text);font-size:19px;margin-bottom:8px}
.ghost{color:var(--brand);font-weight:700;margin-top:10px}
/* 等待中的三個點：輪流往上跳，顏色跟著文字 */
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
/* 影片播放器與會員名字浮水印（慢慢在畫面上移動） */
.player{position:relative;margin-top:16px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9}
.player video{display:block;width:100%;height:100%}
.wm{position:absolute;left:8%;top:12%;color:rgba(255,255,255,.45);font-size:14px;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.6);pointer-events:none;user-select:none;animation:wm 24s linear infinite}
@keyframes wm{0%{left:8%;top:12%}25%{left:62%;top:20%}50%{left:55%;top:72%}75%{left:10%;top:64%}100%{left:8%;top:12%}}
/* 我的課程：入口（2×2 篩選器）、分區標題、換頁 */
.entries{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.entry{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--brand);color:#fff;text-align:left;border:2px solid transparent}
.entry img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.entry .en{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.entry b{display:block;font-size:15px}
.entry small{display:block;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry.on{border-color:var(--accent)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.sec h2{font-size:17px}
.chip{font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-bg);border-radius:10px;padding:4px 10px}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;color:var(--soft)}
.pager button{font-weight:700;color:var(--brand);padding:8px 10px}
.pager button:disabled{opacity:.35}
.notice{margin-top:14px;border-radius:12px;background:var(--amber-bg);color:var(--amber);padding:10px 14px;font-size:15px}
/* 圖片一律 16:9，裁切置中 */
.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:var(--brand-bg);margin-top:16px}
.cover.ph{display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:20px}
.cover-wrap{position:relative}
.cover-wrap .cover{margin-top:0}
.lock{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:2px 8px}
.meta{color:var(--muted);font-size:13px;margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-bg);border-radius:8px;padding:1px 8px}
.post .cover{margin:-16px -16px 0;width:calc(100% + 32px);border-radius:16px 16px 0 0}
.post h2{margin-top:2px}
.body{white-space:pre-line;color:var(--soft)}
.grid{display:grid;gap:14px;margin-top:6px}
@media (min-width:520px){.grid{grid-template-columns:1fr 1fr}}
.grid .card{margin-top:0}
.item{display:block;text-decoration:none;color:inherit;padding:0;overflow:hidden}
.item .cover,.item .cover-wrap .cover{border-radius:0}
.item h2{padding:12px 14px 0;font-size:16px}
/* 卡片簡介只留一行 */
.item .lead{padding:0 14px 14px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail h1{margin-top:12px}
.cta{display:grid;gap:8px;margin-top:18px}
.cta .ghost{text-align:center}
.btn{display:grid;place-items:center;text-decoration:none}
/* 管理會員：統計、搜尋、名冊 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat small{color:var(--soft);font-size:12px}
.stat.total{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stat.total small{color:var(--on-brand);opacity:.85}
.stat.hot{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.search{margin-top:14px}
.rows{display:grid;gap:8px;margin-top:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.row.open{border-color:var(--brand)}
.row-head{display:flex;align-items:center;gap:8px}
.row-head .badge{margin-left:auto}
.row small{color:var(--soft)}
.info{margin-top:12px;font-size:14px}
.ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.op{flex:1;min-width:120px;height:44px;border-radius:12px;font-weight:700;background:var(--brand);color:var(--on-brand)}
.op.premium{background:var(--accent);color:#1F2330}
.op.ban{background:var(--red-bg);color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <header><button class="back" id="back" type="button" aria-label="回上一頁">‹</button><span class="mark" id="mark" hidden></span><span class="brand" id="brand">會員專區</span><span id="badge"></span></header>
  <main id="app"><p class="blocked" role="status">讀取中<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p></main>
</div>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
