<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://static.line-scdn.net https://liffsdk.line-scdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://hook.us2.make.com https://api.line.me https://*.line.me https://*.line-scdn.net https://uts-front.line-apps.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<title>短影片題材產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
--bg: #F3F1EE;
--card: #FFFFFF;
--ink: #1D2230;
--muted: #6B6F7B;
--line: #E2DED8;
--rec: #E5432F;
--rec-soft: #FDE8E4;
--tag: #2F5BD3;
--tag-soft: #E6ECFB;
--display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
--script: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
--mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
--bg: #15171D; --card: #1F222B; --ink: #ECEAE6; --muted: #9DA1AC; --line: #2E323D;
--rec: #FF6450; --rec-soft: #3A211E; --tag: #8EAAFF; --tag-soft: #232C47; color-scheme: dark } }
:root[data-theme="dark"] {
--bg: #15171D; --card: #1F222B; --ink: #ECEAE6; --muted: #9DA1AC; --line: #2E323D;
--rec: #FF6450; --rec-soft: #3A211E; --tag: #8EAAFF; --tag-soft: #232C47; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 20px 48px;
padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-direction: column; gap: 4px; }
.rec { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--rec); }
.rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec i { animation: none; } }
h1 { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 14px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
label { font-weight: 700; font-size: 14px; display: block; margin-bottom: 6px; }
label small { font-weight: 400; color: var(--muted); }
input[type=text], textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.go { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 12px; padding: 14px; cursor: pointer;
background: var(--rec); color: #fff; display: flex; justify-content: center; align-items: center; gap: 8px; }
.go:disabled { opacity: .55; cursor: default; }
.ghost { font: inherit; font-size: 14px; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.status { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }
.status.err { color: var(--rec); }
.result { display: flex; flex-direction: column; gap: 12px; }
.result-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.result-head h2 { margin: 0; font-size: 18px; font-family: var(--display); }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--tag-soft); color: var(--tag); font-weight: 700; }
.tabs { display: grid; grid-template-columns: repeat(2, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px;
position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tab { font: inherit; font-size: 14px; font-weight: 700; border: 0; background: none; color: var(--muted); padding: 9px 4px; border-radius: 9px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.panel { display: flex; flex-direction: column; gap: 10px; }
.dir { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.dir[aria-current="true"] { border-color: var(--rec); box-shadow: 0 0 0 1px var(--rec); }
.dir h3 { margin: 0; font-size: 17px; line-height: 1.4; font-family: var(--display); font-weight: 900; }
.dir .hook { font-family: var(--script); font-size: 16px; background: var(--rec-soft); border-radius: 8px; padding: 8px 10px; }
.dir .hook::before { content: "開場 "; font-family: var(--mono); font-size: 11px; color: var(--rec); letter-spacing: .06em; }
.dir p { margin: 0; font-size: 14px; color: var(--muted); }
.dir .pick { font-size: 13px; color: var(--rec); font-weight: 700; }
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet h3 { margin: 0; font-size: 18px; font-family: var(--display); font-weight: 900; line-height: 1.4; }
.seg { display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
.tc { font-family: var(--mono); font-size: 12px; color: var(--rec); padding-top: 4px; font-variant-numeric: tabular-nums; }
.seg .lab { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.seg .txt { font-family: var(--script); font-size: 18px; line-height: 1.75; min-width: 0; }
.meta { font-size: 13px; color: var(--muted); }
.seg + .seg { padding-top: 14px; border-top: 1px dashed var(--line); }
.view { margin-top: 10px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.view .vl { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.view b { display: block; font-size: 14px; font-weight: 700; }
.view .cap { display: inline-block; margin-top: 6px; font-weight: 900; font-size: 13px; background: var(--ink); color: var(--bg); padding: 2px 8px; border-radius: 4px; }
.view .tip { margin-top: 6px; font-size: 13px; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
<header>
<span class="rec"><i></i>REC · 60s</span>
<h1>短影片題材產生器</h1>
<p class="sub">輸入想講的主題，一次拿到三個影片方向、一分鐘講稿和畫面建議。依「16 條短影音心法」產生。</p>
</header>
<div class="row" style="margin:0 0 12px"><button type="button" class="ghost" id="savedBtn">我的紀錄</button></div>
<div id="savedList" hidden style="margin:0 0 16px"></div>
<form id="f">
<div>
<label for="topic">你想講什麼事情</label>
<input type="text" id="topic" placeholder="例如：用 AI 十分鐘做完簡報" autocomplete="off" required>
</div>
<div>
<label for="who">你是誰 <small>（選填：職業、專長、在賣什麼）</small></label>
<textarea id="who" placeholder="例如：教上班族用 AI 的講師"></textarea>
</div>
<div>
<label id="ctaLabel">希望觀眾看完做什麼</label>
<div class="chips" id="cta" role="group" aria-labelledby="ctaLabel">
<button type="button" class="chip" aria-pressed="true">私訊我</button>
<button type="button" class="chip" aria-pressed="false">底下留言</button>
<button type="button" class="chip" aria-pressed="false">加 LINE</button>
<button type="button" class="chip" aria-pressed="false">追蹤我</button>
<button type="button" class="chip" aria-pressed="false">分享給朋友</button>
<button type="button" class="chip" aria-pressed="false">點連結了解</button>
</div>
<input type="text" id="ctaNote" placeholder="補充（選填）：例如留言「簡報」送你提示詞" autocomplete="off" style="margin-top:8px">
</div>
<label style="display:flex;align-items:center;gap:8px;margin:12px 0"><input type="checkbox" id="keep" style="width:18px;height:18px;flex:none"> 儲存這次結果，之後可以回來看</label>
<button class="go" id="go" type="submit">產生題材</button>
<div class="row" id="ctl" hidden>
<button type="button" class="ghost" id="stop">停止</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
</form>
<section class="result" id="result" hidden>
<div class="result-head">
<h2 id="rTopic"></h2>
</div>
<div class="tabs" role="tablist">
<button class="tab" role="tab" data-tab="dir" aria-selected="true">影片方向</button>
<button class="tab" role="tab" data-tab="script" aria-selected="false">講稿與畫面</button>
</div>
<div class="panel" id="p-dir"></div>
<div class="panel" id="p-script" hidden></div>
</section>
<p class="foot">Phil 的 AI 學院 · 內容由 AI 產生，發布前請自己看過一遍。</p>
</div>
<script src="https://static.line-scdn.net/liff/edge/versions/2.31.2/sdk.js"></script>
<script src="app.js?v=20261031-3"></script>
</body>
</html>
